[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-learning"
version = "0.1.0"
description = "Python learning exercises"
authors = [{name = "Didier Bonnet"}]
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32.5",
]

[tool.setuptools]
packages = ["utility", "passwordchecker", "regular_expressions"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ipython>=8.0",
]
