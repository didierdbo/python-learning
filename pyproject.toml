[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-learning"
version = "0.1.0"
description = "Python learning exercises"
authors = [{name = "Didier Bonnet"}]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "requests>=2.32.5",
    "selenium>=4.41.0",
    "setuptools>=82.0.1",
    "undetected-chromedriver>=3.5.5",
    "webdriver-manager>=4.0.2",
]

[tool.setuptools]
packages = ["utility", "passwordchecker", "regular_expressions"]

[tool.uv.workspace]
members = [
    "web-server",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ipython>=8.0",
]
